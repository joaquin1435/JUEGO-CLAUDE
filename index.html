<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0b0a0d">
<title>La Población · Arena 16</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>:root{--bg:#0b0a0d;--panel:#15131a;--panel2:#1d1a23;--line:#2c2833;--txt:#ece6dc;--mut:#9a9198;--ember:#ff6a2b;--gold:#e8b65a;--red:#e2403a;--green:#4ec27a;--blue:#4aa3ff;--purple:#a879ff;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:fixed;inset:0;z-index:1;overflow:auto}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.6));}
h1,h2,h3,.disp{font-family:"Bebas Neue",Impact,sans-serif;letter-spacing:.04em;font-weight:400}
button{font:inherit;color:var(--txt);cursor:pointer;border:0;background:none}
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:.5em;padding:.85em 1.4em;border-radius:10px;background:linear-gradient(180deg,#2a2530,#1b1820);border:1px solid #3a3440;font-weight:600;transition:transform .12s,border-color .2s,background .2s,box-shadow .2s;color:var(--txt)}
.btn:hover{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset,0 6px 24px -8px rgba(255,106,43,.6);transform:translateY(-1px)}
.btn:active{transform:translateY(1px) scale(.98)}
.btn.primary{background:linear-gradient(180deg,#ff7b3b,#d94a14);border-color:#ff9a62;color:#160b05;font-weight:800}
.btn.primary:hover{box-shadow:0 8px 30px -6px rgba(255,106,43,.8)}
.btn.ghost{background:transparent}
.btn.danger{background:linear-gradient(180deg,#a0221d,#6b1210);border-color:#d0453f}
.btn:disabled{opacity:.35;pointer-events:none}
.btn small{opacity:.7;font-weight:400;font-size:.78em}
.screen{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;animation:fadeIn .5s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes shake{0%,100%{transform:none}20%{transform:translate(-6px,3px)}40%{transform:translate(5px,-4px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-2px)}}
.shake{animation:shake .35s}
/* title */
.logo{text-align:center;margin-bottom:34px}
.logo .kicker{font-size:.8rem;letter-spacing:.5em;color:var(--gold);text-transform:uppercase;margin-bottom:10px;opacity:.85}
.logo h1{font-size:clamp(3.4rem,13vw,8.5rem);line-height:.85;background:linear-gradient(180deg,#fff3e2 10%,#ffb46b 55%,#c2410c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 30px rgba(255,106,43,.35))}
.logo .sub{font-family:"Bebas Neue";font-size:clamp(1.3rem,4vw,2rem);letter-spacing:.6em;color:#d8cbbd;margin-top:6px;padding-left:.6em}
.menu{display:flex;flex-direction:column;gap:10px;width:min(320px,100%)}
.menu .btn{width:100%;padding:1em}
.foot{position:fixed;bottom:12px;left:0;right:0;text-align:center;font-size:.72rem;color:var(--mut);z-index:2;pointer-events:none}
/* panels */
.card{background:linear-gradient(180deg,rgba(29,26,35,.94),rgba(17,15,21,.96));border:1px solid var(--line);border-radius:var(--r);box-shadow:0 20px 60px -20px #000}
.wrap{width:min(1180px,100%)}
.title-row{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.title-row h2{font-size:clamp(2rem,6vw,3.2rem);line-height:1}
.mut{color:var(--mut)}
.tag{display:inline-block;font-size:.7rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:.25em .6em;border-radius:6px;background:#2a2430;color:var(--gold)}
/* select grid */
.grid16{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.tcard{position:relative;padding:10px 8px 10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center;transition:.2s;cursor:pointer}
.tcard img{width:84px;height:84px;display:block;margin:0 auto 6px;border-radius:50%;background:#0f0d12;border:2px solid #2d2833}
.tcard .nm{font-family:"Bebas Neue";font-size:1.45rem;letter-spacing:.06em;line-height:1}
.tcard .pk{font-size:.68rem;color:var(--mut);margin-top:2px}
.tcard:hover{border-color:#5a4f63;transform:translateY(-2px)}
.tcard.sel{border-color:var(--ember);box-shadow:0 0 0 2px var(--ember),0 10px 30px -10px var(--ember)}
.tcard.sel img{border-color:var(--ember)}
.tcard.comp{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.tcard.comp img{border-color:var(--blue)}
.tcard .badge{position:absolute;top:6px;left:6px;font-size:.6rem;font-weight:800;padding:.2em .5em;border-radius:5px}
.detail{display:grid;grid-template-columns:120px 1fr;gap:16px;padding:16px;align-items:center}
.detail img{width:120px;height:120px;border-radius:16px;background:#0f0d12}
.stat{display:grid;grid-template-columns:62px 1fr 22px;align-items:center;gap:8px;font-size:.75rem;margin:3px 0}
.stat .bar{height:7px;border-radius:4px;background:#26212b;overflow:hidden}
.stat .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ember),var(--gold));border-radius:4px}
.selbar{position:sticky;bottom:0;margin-top:16px;padding:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
/* draw */
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.pair{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);animation:pop .45s both}
.pair img{width:48px;height:48px;border-radius:50%}
.pair .dn{font-family:"Bebas Neue";font-size:1.1rem;color:var(--gold);letter-spacing:.1em}
.pair.me{border-color:var(--ember);box-shadow:0 0 30px -10px var(--ember)}
/* hud */
.game{display:grid;grid-template-columns:1fr 360px;grid-template-rows:auto 1fr;gap:12px;padding:12px;height:100%;max-width:1400px;margin:0 auto}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.topbar .day{font-family:"Bebas Neue";font-size:2rem;line-height:1}
.topbar .ph{font-size:.8rem;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
.chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:#211d26;border:1px solid var(--line);font-size:.82rem;font-weight:600}
.spacer{flex:1}
.mapwrap{position:relative;min-height:320px;overflow:hidden;padding:0}
.mapwrap canvas{width:100%;height:100%;display:block}
.side{display:flex;flex-direction:column;gap:12px;min-height:0;overflow:auto}
.who{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px;align-items:center}
.who img{width:56px;height:56px;border-radius:12px;background:#0f0d12}
.who .n{font-family:"Bebas Neue";font-size:1.35rem;line-height:1;display:flex;gap:8px;align-items:center}
.meter{height:8px;border-radius:5px;background:#26212b;overflow:hidden;margin-top:5px;position:relative}
.meter i{display:block;height:100%;transition:width .5s}
.meter.hp i{background:linear-gradient(90deg,#c62b25,#ff5d4a)}
.meter.hu i{background:linear-gradient(90deg,#b07a16,#ffc94a)}
.meter.lo i{background:linear-gradient(90deg,#2266aa,#5ab8ff)}
.ml{display:flex;justify-content:space-between;font-size:.66rem;color:var(--mut);margin-top:4px}
.dead{filter:grayscale(1);opacity:.55}
.inv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px}
.slot{aspect-ratio:1;border-radius:10px;background:#1a171f;border:1px dashed #332d39;display:flex;align-items:center;justify-content:center;font-size:1.5rem;position:relative;cursor:pointer;transition:.15s}
.slot.f{border-style:solid;border-color:#3c3444;background:#221e28}
.slot.f:hover{border-color:var(--gold)}
.slot .q{position:absolute;bottom:2px;right:5px;font-size:.6rem;font-weight:800}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.acts .btn{padding:.75em .5em;flex-direction:column;gap:2px;font-size:.88rem}
.acts .btn .ic{font-size:1.25rem}
.log{padding:10px 12px;font-size:.8rem;line-height:1.5;max-height:200px;overflow:auto}
.log p{padding:3px 0;border-bottom:1px solid #221e27;animation:fadeIn .4s}
.log b{color:var(--gold)}
.log .k{color:var(--red)}
.sectitle{font-size:.68rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);padding:10px 12px 0}
/* modal */
.modal{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(5,4,7,.72);backdrop-filter:blur(4px);animation:fadeIn .25s}
.scene{width:min(620px,100%);max-height:100%;overflow:auto;animation:pop .35s}
.scene canvas{width:100%;height:170px;display:block;border-radius:var(--r) var(--r) 0 0}
.scene .bd{padding:18px 20px 20px}
.scene h3{font-size:2rem;line-height:1;margin-bottom:8px}
.scene p{line-height:1.6;color:#d9d0c6;margin-bottom:12px}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opts .btn{justify-content:space-between;text-align:left;width:100%}
.res{padding:12px 14px;border-radius:10px;background:#0f0d12;border-left:3px solid var(--gold);margin:6px 0 12px;line-height:1.55}
.res.bad{border-color:var(--red)}.res.good{border-color:var(--green)}
/* combat */
.combat{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:#000}
.combat canvas{flex:1;width:100%;min-height:0;display:block}
.cbar{padding:10px 12px 14px;background:linear-gradient(180deg,#120f16,#0a090c);border-top:1px solid var(--line)}
.cbar .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cbar .btn{min-width:108px;flex-direction:column;gap:1px;padding:.6em .8em}
.cbar .btn .ic{font-size:1.15rem}
.cmsg{text-align:center;min-height:1.5em;font-size:.95rem;margin-bottom:8px;color:#e8dccf}
.targets{display:flex;gap:6px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}
.targets .btn{min-width:0;padding:.4em .9em;flex-direction:row;font-size:.8rem}
.targets .btn.on{border-color:var(--red);box-shadow:0 0 0 1px var(--red) inset}
/* night */
.night{text-align:center}
.night h2{font-size:clamp(2.4rem,8vw,4.5rem)}
.fallen{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;margin:26px 0}
.fallen div{animation:pop .6s both;text-align:center}
.fallen img{width:92px;height:92px;border-radius:50%;filter:grayscale(.9) brightness(1.1) drop-shadow(0 0 18px rgba(170,200,255,.55));opacity:.92}
.fallen span{display:block;font-family:"Bebas Neue";font-size:1.3rem;letter-spacing:.1em;margin-top:4px;color:#cdd8ff}
/* end */
.endbig{font-size:clamp(3rem,12vw,7rem);line-height:.9;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:20px 0}
.stats div{padding:14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);text-align:center}
.stats b{display:block;font-family:"Bebas Neue";font-size:2.2rem;line-height:1;color:var(--gold)}
.stats span{font-size:.72rem;color:var(--mut);text-transform:uppercase;letter-spacing:.1em}
.timeline{max-height:220px;overflow:auto;padding:12px 16px;font-size:.85rem;line-height:1.6}
#toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{padding:10px 16px;border-radius:10px;background:#1f1b24;border:1px solid var(--gold);font-size:.88rem;font-weight:600;animation:pop .3s;box-shadow:0 10px 40px -10px #000}
#fx-flash{position:fixed;inset:0;pointer-events:none;z-index:55;background:#fff;opacity:0;transition:opacity .4s}
.range{width:100%;accent-color:var(--ember)}
.opt-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.howto{line-height:1.65;color:#d6ccc2;font-size:.92rem}
.howto h3{color:var(--gold);font-size:1.4rem;margin:14px 0 4px}
.tip{position:fixed;z-index:70;max-width:240px;padding:9px 11px;border-radius:9px;background:#0d0b10;border:1px solid #3d3545;font-size:.78rem;line-height:1.45;pointer-events:none}
@media (max-width:900px){
 html,body{overflow:auto}
 .game{grid-template-columns:1fr;grid-template-rows:auto auto auto;height:auto}
 .mapwrap{height:52vh;min-height:280px}
 .side{overflow:visible}
 .detail{grid-template-columns:84px 1fr}.detail img{width:84px;height:84px}
 .grid16{grid-template-columns:repeat(4,1fr);gap:6px}
 .tcard{padding:6px 2px}.tcard img{width:58px;height:58px}.tcard .nm{font-size:1.1rem}.tcard .pk{display:none}
 .cbar .row{flex-wrap:nowrap;gap:5px}.cbar .btn{min-width:0;flex:1;font-size:.7rem;padding:.55em .2em}.cbar .btn small{font-size:.62rem}
}

.vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4vw;background:radial-gradient(ellipse,rgba(60,10,0,.85),rgba(0,0,0,.92));z-index:5;transition:opacity .45s}
.vs.out{opacity:0}
.vs-side{display:flex;gap:10px}.vs-side img{width:clamp(70px,14vw,150px);height:clamp(70px,14vw,150px);border-radius:50%;border:4px solid var(--gold);box-shadow:0 0 40px -6px var(--ember)}
.vs-side.r img{border-color:var(--red)}
.vs-side.l{animation:slideL .5s cubic-bezier(.2,1.4,.4,1) both}.vs-side.r{animation:slideR .5s cubic-bezier(.2,1.4,.4,1) both}
.vs-mid{font-size:clamp(2.4rem,9vw,6rem);color:#fff;text-shadow:0 0 30px var(--ember);animation:pop .5s .2s both;text-align:center;line-height:.9}
@keyframes slideL{from{transform:translateX(-60vw)}to{transform:none}}@keyframes slideR{from{transform:translateX(60vw)}to{transform:none}}
#lineup{position:fixed;left:0;right:0;bottom:0;width:100%;height:24vh;pointer-events:none;z-index:0;opacity:.55}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.ach{display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ach .i{font-size:1.8rem}.ach.off{opacity:.38;filter:grayscale(1)}
@media (max-width:900px){.vs{flex-direction:column;gap:12px}}

.w{opacity:0;animation:wIn .35s forwards;display:inline-block}
@keyframes wIn{from{opacity:0;transform:translateY(4px);filter:blur(3px)}to{opacity:1;transform:none;filter:none}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app"></div>
<div id="toast"></div>
<div id="fx-flash"></div>
<script>// ===== Audio: todo sintetizado con WebAudio =====
const Snd = (() => {
  let ac, master, musG, sfxG, noiseBuf, mode = 'none', timer, step = 0, nextT = 0;
  const vol = { music: 0.5, sfx: 0.8 };
  function init() {
    if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return; }
    master = ac.createGain(); master.gain.value = 0.9;
    const comp = ac.createDynamicsCompressor(); master.connect(comp); comp.connect(ac.destination);
    musG = ac.createGain(); sfxG = ac.createGain(); musG.connect(master); sfxG.connect(master);
    setVol(vol.music, vol.sfx);
    noiseBuf = ac.createBuffer(1, ac.sampleRate * 1.5, ac.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    timer = setInterval(sched, 60);
  }
  function setVol(m, s) { vol.music = m; vol.sfx = s; if (musG) { musG.gain.value = m * 0.55; sfxG.gain.value = s; } }
  function env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function osc(type, f, t, a, d, peak, dest, fEnd) {
    const o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f, t);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(fEnd, t + a + d);
    env(g, t, a, d, peak); o.connect(g); g.connect(dest || sfxG); o.start(t); o.stop(t + a + d + 0.05);
  }
  function noise(t, d, peak, ftype, f, dest, q) {
    const s = ac.createBufferSource(), g = ac.createGain(), fl = ac.createBiquadFilter();
    s.buffer = noiseBuf; fl.type = ftype || 'lowpass'; fl.frequency.value = f || 1200; fl.Q.value = q || 1;
    env(g, t, 0.005, d, peak); s.connect(fl); fl.connect(g); g.connect(dest || sfxG); s.start(t); s.stop(t + d + 0.1);
  }
  const fx = {
    click: t => osc('triangle', 660, t, .002, .06, .15),
    hover: t => osc('sine', 980, t, .002, .03, .04),
    swing: t => noise(t, .16, .35, 'bandpass', 1800, 0, 2),
    hit: t => { noise(t, .12, .7, 'lowpass', 900); osc('square', 140, t, .002, .12, .25, 0, 50); },
    crit: t => { noise(t, .2, .9, 'lowpass', 1400); osc('sawtooth', 220, t, .002, .25, .3, 0, 40); osc('triangle', 1300, t + .02, .002, .2, .15, 0, 600); },
    miss: t => noise(t, .2, .18, 'highpass', 3000),
    block: t => { osc('square', 900, t, .001, .1, .15, 0, 500); osc('triangle', 1800, t, .001, .2, .08); },
    throwk: t => noise(t, .25, .3, 'bandpass', 2600, 0, 6),
    heal: t => [523, 659, 784, 1046].forEach((f, i) => osc('sine', f, t + i * .07, .01, .3, .14)),
    pick: t => [880, 1320].forEach((f, i) => osc('triangle', f, t + i * .06, .005, .12, .14)),
    bad: t => [300, 220].forEach((f, i) => osc('sawtooth', f, t + i * .12, .01, .25, .1)),
    cannon: t => { noise(t, 1.6, 1, 'lowpass', 220); osc('sine', 70, t, .005, 1.4, .9, 0, 28); },
    gong: t => [110, 165, 221, 330].forEach(f => osc('sine', f, t, .01, 3, .18)),
    step: t => noise(t, .07, .18, 'lowpass', 500),
    smoke: t => noise(t, 1, .4, 'bandpass', 700, 0, .5),
    betray: t => { [440, 415, 392, 370].forEach((f, i) => osc('sawtooth', f, t + i * .18, .02, .4, .09)); noise(t, .5, .3, 'lowpass', 300); },
    win: t => [392, 494, 587, 784, 988].forEach((f, i) => osc('triangle', f, t + i * .12, .01, .7, .16)),
    lose: t => [392, 349, 311, 262].forEach((f, i) => osc('triangle', f, t + i * .25, .02, .8, .14)),
    drop: t => { osc('sine', 1200, t, .01, .9, .1, 0, 300); setTimeout(() => play('pick'), 900); },
    tick: t => osc('square', 1500, t, .001, .03, .05),
    death: t => { osc('sawtooth', 300, t, .01, .9, .2, 0, 40); noise(t, .6, .3, 'lowpass', 400); },
  };
  function play(n) { if (!ac || !fx[n]) return; try { fx[n](ac.currentTime + 0.01); } catch (e) {} }
  // --- música generativa ---
  const scales = { menu: [0, 3, 7, 10, 12, 15], map: [0, 2, 3, 7, 8, 12], combat: [0, 1, 3, 7, 8, 12] };
  function sched() {
    if (!ac || mode === 'none') return;
    const bpm = mode === 'combat' ? 128 : mode === 'menu' ? 70 : 84, spb = 60 / bpm / 2;
    if (nextT < ac.currentTime) nextT = ac.currentTime + 0.05;
    while (nextT < ac.currentTime + 0.25) {
      const t = nextT, s = step % 32, root = mode === 'combat' ? 55 : 49, sc = scales[mode] || scales.map, mf = n => root * Math.pow(2, n / 12);
      if (s % 16 === 0) { const ch = [0, 7, 12].map(n => mf(n + (step % 64 < 32 ? 0 : (mode === 'combat' ? -2 : 5)))); ch.forEach(f => { osc('sawtooth', f, t, 1.2, spb * 16, .045, musG); osc('sine', f / 2, t, .6, spb * 16, .07, musG); }); }
      if (mode === 'combat') {

// ---------- paisajes ----------
function paintBiome(c, W, H, b, opts = {}) {
  const [top, mid, low] = BIOME_COL[b] || BIOME_COL.field, r = seeded(b + (opts.seed || ''));
  const night = opts.night;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, night ? '#05060d' : shade(top, 20)); g.addColorStop(.55, night ? '#121528' : shade(mid, -30)); g.addColorStop(1, low);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  if (night) { for (let i = 0; i < 80; i++) { c.fillStyle = `rgba(255,255,255,${r() * .7})`; c.fillRect(r() * W, r() * H * .6, 1.5, 1.5); } c.fillStyle = '#e8ecff'; c.beginPath(); c.arc(W * .82, H * .18, 18, 0, 7); c.fill(); }
  else { const sg = c.createRadialGradient(W * .75, H * .2, 5, W * .75, H * .2, H * .6); sg.addColorStop(0, 'rgba(255,220,160,.45)'); sg.addColorStop(1, 'rgba(255,220,160,0)'); c.fillStyle = sg; c.fillRect(0, 0, W, H); }
  const hz = H * .62;
  // capas de fondo
  for (let layer = 0; layer < 3; layer++) {
    const yb = hz + layer * H * .07, col = shade(mid, -55 + layer * 18 - (night ? 40 : 0));
    c.fillStyle = col; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20) {
      let yy = yb;
      if (b === 'mountain') yy -= (Math.abs(Math.sin(x * .006 + layer * 2 + r() * .1)) * 130 + r() * 10) * (1 - layer * .3);
      else if (b === 'forest') yy -= 40 + Math.abs(Math.sin(x * .05 + layer)) * 50 + r() * 30;
      else if (b === 'ruins' || b === 'corn') yy -= (Math.floor(x / 60 + layer) % 3 === 0 ? 70 : 20) + r() * 8;
      else yy -= Math.sin(x * .01 + layer) * 18 + 10;
      c.lineTo(x, yy);
    }
    c.lineTo(W, H); c.fill();
  }
  if (b === 'forest') for (let i = 0; i < 14; i++) { const x = r() * W, hh = 90 + r() * 90; c.fillStyle = shade(mid, -70 - (night ? 30 : 0)); c.beginPath(); c.moveTo(x, hz + 30 - hh); c.lineTo(x - 28, hz + 30); c.lineTo(x + 28, hz + 30); c.fill(); }
  if (b === 'river' || b === 'beach' || b === 'swamp') { c.fillStyle = b === 'swamp' ? 'rgba(80,100,50,.6)' : 'rgba(90,160,220,.35)'; c.fillRect(0, hz + H * .1, W, H * .1); }
  if (b === 'corn') { c.fillStyle = shade('#c9a14a', night ? -80 : -20); c.beginPath(); c.moveTo(W * .35, hz + 25); c.quadraticCurveTo(W * .5, hz - 90, W * .68, hz - 30); c.lineTo(W * .64, hz + 25); c.fill(); }
  if (b === 'cave') { c.fillStyle = '#050407'; c.beginPath(); c.ellipse(W * .5, hz + 10, W * .18, H * .2, 0, Math.PI, 0); c.fill(); }
  // suelo
  const gg = c.createLinearGradient(0, hz + H * .12, 0, H); gg.addColorStop(0, shade(low, 30)); gg.addColorStop(1, shade(low, -10));
  c.fillStyle = gg; c.fillRect(0, hz + H * .18, W, H);
  // niebla
  c.fillStyle = night ? 'rgba(30,40,80,.18)' : 'rgba(255,240,220,.06)'; c.fillRect(0, hz - 30, W, 80);
}

const Parts = {
  list: [],

// ---------- fondo animado de menú (brasas) ----------
const BG = (() => {
  const cv = document.getElementById('bg'), c = cv.getContext('2d'); let W, H, embers = [], on = true;
  function rs() { W = cv.width = innerWidth * devicePixelRatio; H = cv.height = innerHeight * devicePixelRatio; }

  function loop(now) {

    const g = c.createRadialGradient(W * .5, H * 1.1, 10, W * .5, H * .8, H * 1.1); g.addColorStop(0, '#3a1406'); g.addColorStop(.45, '#140b0b'); g.addColorStop(1, '#09080b');

// Muestra resultado con botón continuar

// ===== Núcleo: estado, helpers de efectos, IA, flujo de días =====
let G = null;
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function newTribute(ch) { const maxhp = 70 + ch.res * 5 + (ch.perk === 'tanque' ? 25 : 0); return { ch, id: ch.id, name: ch.name, L: lookOf(ch), fue: ch.fue, agi: ch.agi, ast: ch.ast, res: ch.res, perk: ch.perk, hp: maxhp, maxhp, weapon: null, alive: true, kills: 0, killer: null, diedDay: 0, team: null }; }
const hasPerk = (t, p) => t && t.alive && t.perk === p;
const teamPerk = p => hasPerk(G.P, p) || hasPerk(G.C, p);
const aliveT = () => G.all.filter(t => t.alive);
const aliveTeams = () => G.teams.filter(tm => tm.m.some(t => t.alive));
const myTeam = () => G.teams[0];

function startGame(pid, cid) {
  const all = CHARS.map(newTribute), P = all[pid], C = all[cid];
  const rest = shuffle(all.filter(t => t !== P && t !== C));
  const teams = [{ id: 0, m: [P, C], sec: 0, inv: [], player: true }];
  for (let i = 0; i < 7; i++) teams.push({ id: i + 1, m: [rest[i * 2], rest[i * 2 + 1]], sec: 0, inv: [], trust: ri(40, 90) });
  teams.forEach(tm => tm.m.forEach(t => { t.team = tm.id; if (t.perk === 'arquero') t.weapon = 'arco'; }));
  G = { day: 1, phase: 0, all, P, C, teams, inv: [], fame: 0, hunger: 100, loyalty: hasPerk(P, 'leal') || hasPerk(C, 'leal') ? 80 : 62, sec: 0, log: [], fallenToday: [], hazard: null, closed: [], trap: null, timeline: [], energyBonus: 0, over: false, moved: false, sponsorGot: 0, betrayed: null, allies: [], stats: { dealt: 0, taken: 0 } };
  if (teamPerk('trampera')) G.inv.push('trampa');
  G.inv.push('agua');
  return G;
}
// ---- efectos (usados por escenas) ----
function addLog(html, cls) { G.log.unshift({ html, cls, d: G.day, p: G.phase }); if (G.log.length > 80) G.log.pop(); }
function mark(txt) { G.timeline.push(`<b>Día ${G.day} · ${PHASES[G.phase]}:</b> ${txt}`); }
function hurt(t, n, by) {
  if (!t || !t.alive) return 0; n = Math.round(n); t.hp = Math.max(0, t.hp - n);
  if (t.hp <= 0) kill(t, by); return n;
}
function heal(t, n) { if (!t || !t.alive) return 0; const b = t.hp; t.hp = Math.min(t.maxhp, t.hp + Math.round(n)); return t.hp - b; }
function kill(t, by, how) {
  if (!t.alive) return; t.alive = false; t.hp = 0; t.diedDay = G.day; t.killer = by ? by.name : (how || 'la arena');
  if (by) by.kills++;
  if (by === G.P && typeof ach === 'function') { ach('primera'); if (G.P.kills >= 5) ach('carnicero'); }
  G.fallenToday.push(t);
  if (t === G.P) mark(`Caíste. ${by ? 'Te mató ' + cap(by.name) : 'Te venció ' + (how || 'la arena')}.`);
  else if (t === G.C) mark(`Murió ${cap(t.name)}, tu compañero.`);
  else if (by === G.P || by === G.C) mark(`${cap(by.name)} eliminó a ${cap(t.name)}.`);
}
function feed(n) { const m = teamPerk('cocinero') ? 2 : 1; G.hunger = clamp(G.hunger + n * m, 0, 100); }
function fame(n) { if (n > 0 && teamPerk('carisma')) n = Math.round(n * 1.5); G.fame = Math.max(0, G.fame + n); }
function loyal(n) { if (n < 0 && teamPerk('leal')) n = Math.round(n / 3); G.loyalty = clamp(G.loyalty + n, 0, 100); }
function give(id, silent) {
  if (WEAPONS.includes(id)) {
    const w = ITEMS[id].w, cur = G.P.weapon ? ITEMS[G.P.weapon].w : 0, cw = G.C.alive && G.C.weapon ? ITEMS[G.C.weapon].w : 0;
    if (w > cur) { if (G.P.weapon && G.C.alive && (!G.C.weapon || ITEMS[G.P.weapon].w > cw)) G.C.weapon = G.P.weapon; G.P.weapon = id; }
    else if (G.C.alive && w > cw) G.C.weapon = id; else return silent ? '' : `${ITEMS[id].ic} ${ITEMS[id].n} (no te sirve, lo dejás)`;
    return `${ITEMS[id].ic} ${ITEMS[id].n} (equipado)`;
  }
  if (G.inv.length >= 10) return `${ITEMS[id].ic} ${ITEMS[id].n} (no te entra en la mochila)`;

}
function rollLoot(rare = .25) { if (teamPerk('suerte')) rare += .2; return Math.random() < rare ? pick(LOOT_RARE) : pick(LOOT_COMMON); }
function chk(stat, dc, who) {
  who = who || G.P; const v = who[stat] + (stat === 'agi' && who.weapon === 'hacha' ? -1 : 0), d = ri(1, 10), ok = v + d >= dc;
  const nm = { fue: 'Fuerza', agi: 'Agilidad', ast: 'Astucia', res: 'Resistencia' }[stat];
  return { ok, s: `<span class="mut" style="font-size:.78em">🎲 ${nm} ${v} + ${d} = ${v + d} vs ${dc} ${ok ? '✔' : '✘'}</span>` };

// ---- IA de otros equipos ----
function teamPower(tm) { return tm.m.filter(t => t.alive).reduce((s, t) => s + (t.hp / t.maxhp * .6 + .4) * (t.fue + t.agi * .5 + (t.weapon ? ITEMS[t.weapon].w : 0)), 0); }
function aiMove() {
  for (const tm of G.teams) {

  if (opt.preDmg) { for (const e of foes(F[0])) await applyDmg(e, opt.preDmg, F[0], false); say('¡Cayeron en tu trampa!'); await sleep(600); }

  let result = null, round = 0;
  while (!result) {

    if (round === 1 && opt.ambush) order.sort((a, b) => (a.side === 'B' ? -1 : 1) - (b.side === 'B' ? -1 : 1));
    if (round === 1 && opt.firstStrike) order.sort((a, b) => (a.side === 'A' ? -1 : 1) - (b.side === 'A' ? -1 : 1));
    if (teamPerk('estratega')) { const p = order.findIndex(f => f.t === G.P); if (p > 0) order.unshift(order.splice(p, 1)[0]); }

        else if (ch.a === 'pow') { f.energy -= 3; await strike(f, target && !target.dead ? target : foes(f)[0], 1.75, 'golpe fuerte'); }
        else if (ch.a === 'def') { f.guard = true; f.energy++; anim(f, 'guard', 500); say('Te cubrís.'); await sleep(450); }

        else if (ch.a === 'run') { if (Math.random() < ch.fleeP) { F.filter(x => x.side === 'A' && !x.dead).forEach(x => anim(x, 'run', 900)); say('¡Te escapás!'); Snd.play('step'); await sleep(900); result = 'fled'; break; } say('¡No podés escapar!'); Snd.play('bad'); await sleep(600); }

      if (!G.P.alive) { result = 'lose'; break; }

    }
    if (!result && !F.some(f => f.side === 'B' && !f.dead)) result = 'win';

}

  if (G.closed.includes(G.sec)) { hurt(G.P, 30); hurt(G.C, 30); shakeEl(); flash('#f00', .3); await tell({ title: 'Zona cerrada', biome: SECTORS[G.sec].b, text: 'El aire quema. Esta zona ya no es parte de la arena. -30 de vida. ¡Salí de acá!', cls: 'bad' }); if (!G.P.alive) { G.P.killer = 'la zona cerrada'; return gameOver(); } }
  if (G.hazard && G.hazard.sec === G.sec) { const d = G.hazard.dmg; hurt(G.P, d); hurt(G.C, d * .8); shakeEl(); await tell({ title: G.hazard.ic + ' ' + G.hazard.n, biome: SECTORS[G.sec].b, text: `${G.hazard.t} -${d} de vida.`, cls: 'bad' }); if (!G.P.alive) { G.P.killer = G.hazard.n.toLowerCase(); return gameOver(); } }
  // hambre
  G.hunger = Math.max(0, G.hunger - (teamPerk('resist') ? 5 : 10));
  if (G.hunger === 0) { hurt(G.P, 8); hurt(G.C, 6); loyal(-4); toast('🍖 El hambre te está matando. -8 vida'); if (!G.P.alive) { G.P.killer = 'el hambre'; return gameOver(); } }
  if (G.C.alive && G.C.hp < G.C.maxhp * .3 && Math.random() < .3) loyal(-3);
  if (await checkEnd()) return;
  G.phase++;
  if (G.phase > 2) { await nightFall(); if (G.over) return; G.day++; G.phase = 0; await newDay(); if (G.over) return; }
  busy = false; renderGame();
}
async function encounter(tm, ambush) {
  const foes = tm.m.filter(t => t.alive); if (!foes.length) return;
  const faces = foes.map(t => ({ ...t, enemy: true }));
  let pre = 0; if (G.trap === G.sec) { ach('trampa'); mark('Alguien cayó en tu trampa.'); pre = teamPerk('trampera') ? 30 : 16; G.trap = null; }
  const pw = teamPower(tm), mine = teamPower(myTeam()), feel = pw > mine * 1.25 ? 'Se los ve <b style="color:#ff6b5b">más fuertes que ustedes</b>.' : pw < mine * .8 ? 'Se los ve <b style="color:#4ec27a">débiles</b>.' : 'Parejo.';
  let r;
  if (ambush) {
    Snd.play('bad'); shakeEl();
    await tell({ title: '¡Emboscada!', biome: SECTORS[G.sec].b, faces, text: `${foes.map(t => cap(t.name)).join(' y ')} te caen encima sin aviso.`, cls: 'bad', btn: 'Defenderse' });
    r = await fight([G.P, G.C], foes, { ambush: true, preDmg: pre, banner: 'EMBOSCADA' });
  } else {
    const i = await ask({ tag: SECTORS[G.sec].n, title: 'Encuentro', biome: SECTORS[G.sec].b, faces, text: `${foes.map(t => `<b>${cap(t.name)}</b> ${t.weapon ? ITEMS[t.weapon].ic : '👊'}`).join(' y ')} aparecen ${foes.length > 1 ? 'entre' : 'detrás de'} los árboles. ${feel}${pre ? ' <b>Están parados justo sobre tu trampa.</b>' : ''}`, opts: [
      { t: '⚔️ Pelear', sub: G.trackBonus ? 'Atacás primero' : '', cls: 'primary' }, { t: '🗣️ Negociar', sub: 'Astucia' }, { t: '🏃 Escapar', sub: 'Agilidad' }] });
    if (i === 0) { r = await fight([G.P, G.C], foes, { preDmg: pre, firstStrike: !!G.trackBonus }); G.trackBonus = 0; }
    else if (i === 1) { const c = chk('ast', 11 + (G.day > 3 ? 2 : 0)); if (c.ok) { const gift = Math.random() < .3 && tm.inv.length ? tm.inv.splice(0, 1)[0] : null; await tell({ title: 'Tregua', biome: SECTORS[G.sec].b, faces, text: `Les hablás tranquilo. Bajan las armas. "Hoy no." ${gift ? 'Hasta te tiran ' + give(gift) + ' de buena onda.' : ''} ${c.s}`, cls: 'good' }); tm.sec = pick(SECTORS[G.sec].adj.filter(a => !G.closed.includes(a)).concat([0])); return; } await tell({ title: 'No funcionó', biome: SECTORS[G.sec].b, faces, text: `Se ríen en tu cara y atacan. ${c.s}`, cls: 'bad' }); r = await fight([G.P, G.C], foes, { ambush: true, preDmg: pre }); }
    else { const c = chk('agi', 10 - (teamPerk('sigilo') ? 3 : 0)); if (c.ok) { G.sec = pick(SECTORS[G.sec].adj.filter(a => !G.closed.includes(a)).concat([0])); fame(-2); await tell({ title: 'Escape', biome: SECTORS[G.sec].b, text: `Corrés hasta que no te dan más las piernas. Terminás en ${SECTORS[G.sec].n}. ${c.s}`, cls: 'good' }); return; } await tell({ title: 'Te alcanzan', biome: SECTORS[G.sec].b, faces, text: `Tropezás. Te alcanzan. ${c.s}`, cls: 'bad' }); r = await fight([G.P, G.C], foes, { ambush: true }); }
  }
  await afterFight(r, tm);
}
async function afterFight(r, tm) {
  if (r === 'win') {
    const got = []; tm.inv.splice(0).forEach(i => got.push(give(i))); tm.m.forEach(t => { if (!t.alive && t.weapon) { const w = t.weapon; t.weapon = null; const g = give(w, true); if (g) got.push(g); } });
    loyal(8); fame(5); [G.P, G.C].forEach(t => heal(t, t.maxhp * .15));
    await tell({ title: 'Ganaron', biome: SECTORS[G.sec].b, faces: tm.m.map(t => ({ ...t, enemy: true })), text: `${tm.m.filter(t => !t.alive).map(t => cap(t.name)).join(' y ')} ${tm.m.filter(t => !t.alive).length > 1 ? 'quedan' : 'queda'} en el piso. La adrenalina les devuelve algo de aire (+15% vida).${got.filter(Boolean).length ? ' Se llevan: ' + got.filter(Boolean).join(', ') + '.' : ''}`, cls: 'good' });
    if (tm.m.some(t => t.alive)) tm.sec = pick(SECTORS[G.sec].adj);
  } else if (r === 'fled') { const old = G.sec; G.sec = pick(SECTORS[G.sec].adj.filter(a => !G.closed.includes(a)).concat([0]).filter(a => a !== old)); loyal(-3); addLog(`Huyen a <b>${SECTORS[G.sec].n}</b>.`); }
  renderGame();
}
async function checkEnd() {
  if (!G.P.alive) { await gameOver(); return true; }
  const others = aliveTeams().filter(tm => !tm.player);
  if (!others.length) { await finalDilemma(); return true; }
  return false;
}
async function nightFall() {
  for (const id of G.allies.slice()) { const tm = G.teams[id]; if (!tm.m.some(t => t.alive)) { G.allies.splice(G.allies.indexOf(id), 1); continue; } if (Math.random() < .12 + G.day * .04) { G.allies.splice(G.allies.indexOf(id), 1); addLog(`<b>${tm.m.filter(t => t.alive).map(t => cap(t.name)).join(' y ')}</b> rompieron la alianza con ustedes.`, 'k'); toast('💔 Se rompió una alianza'); } }
  if (G.hunger >= 100) ach('hambre');
  aiNightBetrayals();
  const fallen = G.fallenToday.filter(t => t !== G.P); G.fallenToday = [];
  view(`<div class="screen night" style="background:radial-gradient(ellipse at top,#121a35,#05060c 70%)"><div class="mut" style="letter-spacing:.4em;text-transform:uppercase;font-size:.8rem">Fin del día ${G.day}</div><h2>El cielo de la noche</h2>
  <div class="fallen" id="fl">${fallen.length ? '' : '<p class="mut" style="font-size:1.1rem">Hoy no sonó ningún cañón.</p>'}</div><p class="mut" id="nt"></p><button class="btn primary" id="nx" style="margin-top:14px;visibility:hidden">Seguir</button></div>`);
  Snd.music('menu');
  for (const t of fallen) { const d = document.createElement('div'); d.innerHTML = `<img src="${portrait(t.ch, 160, 0)}"><span>${cap(t.name)}</span>`; $('#fl').appendChild(d); Snd.play('cannon'); await sleep(1100); }
  $('#nt').innerHTML = `Quedan <b style="color:#fff">${aliveT().length}</b> tributos.`;
  await sleep(400); $('#nx').style.visibility = 'visible';
  await new Promise(r => $('#nx').onclick = r);
  screenGame(); Snd.music('map');
  // patrocinadores
  if (G.fame >= 25) { const n = Math.min(2, Math.floor(G.fame / 25)); G.fame -= n * 25; const gifts = []; for (let i = 0; i < n; i++) gifts.push(give(teamPerk('suerte') ? pick(LOOT_RARE) : rollLoot(.5))); Snd.play('drop'); await tell({ title: '🪂 Patrocinadores', biome: SECTORS[G.sec].b, night: true, text: `Dos pitidos y un paracaídas plateado. Alguien allá afuera apuesta por vos: ${gifts.join(', ')}.`, cls: 'good' }); }
  // traición del compañero
  if (G.C.alive && G.P.alive) {
    G.loyalty = clamp(G.loyalty - 4, 0, 100);
    const p = G.loyalty < 30 ? (30 - G.loyalty) / 30 * .7 + .1 : 0;
    if (Math.random() < p) {
      Snd.play('betray'); shakeEl(); flash('#a00', .4);
      await tell({ title: 'Un ruido en la oscuridad', biome: SECTORS[G.sec].b, night: true, faces: [{ ...G.C, enemy: true }], text: `Te despertás con ${cap(G.C.name)} encima tuyo, cuchillo en mano. "Perdón. Solo puede quedar uno."`, cls: 'bad', btn: 'Pelear por tu vida' });
      const r = await fight([G.P], [G.C], { ambush: true, noflee: true, banner: 'TRAICIÓN' });
      if (!G.P.alive) { G.over = true; return gameOver(); }
      mark(`${cap(G.C.name)} te traicionó y lo mataste.`); ach('sobrevivi'); fame(15); G.betrayed = 'them'; if (G.C.weapon) give(G.C.weapon, true);
    }
  }
  if (aliveTeams().filter(tm => !tm.player).length === 0) { await finalDilemma(); }
}
async function newDay() {
  G.feast = G.feast === 1 ? 2 : 0;
  if (G.feast === 2) G.teams.forEach(tm => { if (!tm.player && Math.random() < .5) tm.sec = 0; });
  const ring = [1, 2, 3, 4, 5, 6, 7, 8];
  if (G.day >= 3) { const open = ring.filter(s => !G.closed.includes(s)); for (let k = 0; k < (G.day >= 5 ? 3 : 2) && open.length > 1; k++) G.closed.push(open.splice(ri(0, open.length - 1), 1)[0]); }
  const openR = ring.filter(s => !G.closed.includes(s)), hz = pick(HAZARDS);
  G.hazard = G.day >= 2 && openR.length ? { ...hz, sec: pick(openR) } : null;
  const others = aliveTeams().filter(tm => !tm.player).length;
  if (G.day >= 6 || others <= 1) return finale();
  const msg = [`Amanece el día ${G.day}.`];
  if (G.hazard) msg.push(`${G.hazard.ic} <b>${G.hazard.n}</b> en ${SECTORS[G.hazard.sec].n}.`);
  if (G.day >= 3) msg.push(`⛔ La arena se achica: ${G.closed.map(s => SECTORS[s].n).join(', ')} están cerradas.${G.closed.includes(G.sec) ? ' <b>¡Estás en una zona cerrada, movete ya!</b>' : ''}`);
  if (G.day === 5) msg.push('<b>Mañana es el final. Todos a la Cornucopia.</b>');
  if (G.feast === 2) msg.push('🎁 Hoy hay festín en la Cornucopia.');
  addLog(msg.join(' '));
  Snd.play('gong');
  await tell({ tag: `Día ${G.day}`, title: 'Amanece', biome: SECTORS[G.sec].b, text: msg.join('<br>') });
}
async function finale() {
  ach('final'); busy = true; G.sec = 0; renderGame();
  await tell({ tag: 'El final', title: 'Todos a la Cornucopia', biome: 'corn', text: 'Las paredes de la arena avanzan. El suelo tiembla. No queda dónde esconderse: el Consejo los quiere a todos en el centro. Ahora.' });
  let ai = aliveTeams().filter(tm => !tm.player);
  while (ai.length > 1) { const [a, b] = shuffle(ai); aiFight(a, b); ai = aliveTeams().filter(tm => !tm.player); }
  if (G.fallenToday.length) await tell({ title: 'Mientras llegabas', biome: 'corn', text: `En el centro ya hubo sangre: ${G.fallenToday.filter(t => t !== G.P && t !== G.C).map(t => '<b>' + cap(t.name) + '</b>').join(', ')} no llegaron a verte.`, cls: 'bad' });
  if (ai.length) {
    const tm = ai[0];
    await tell({ title: 'Los últimos', biome: 'corn', faces: tm.m.filter(t => t.alive).map(t => ({ ...t, enemy: true })), text: `Del otro lado de la Cornucopia: ${tm.m.filter(t => t.alive).map(t => cap(t.name)).join(' y ')}. No hay a dónde correr.`, btn: 'Pelear' });
    const r = await fight([G.P, G.C], tm.m, { final: true, banner: 'FINAL' });
    if (!G.P.alive) return gameOver();
    await afterFight(r, tm);
  }
  await finalDilemma();
}
async function finalDilemma() {
  if (G.over) return; G.over = true;
  if (!G.C.alive) return victory();
  const i = await ask({ tag: 'Último acto', title: 'Solo puede quedar uno', biome: 'corn', faces: [G.P, G.C], text: `La voz del Consejo retumba: "Felicitaciones a los dos últimos tributos. Les recordamos que hay un solo vencedor." ${cap(G.C.name)} te mira. Lealtad: ${G.loyalty}.`, opts: [
    { t: '⚔️ Pelear contra tu compañero', cls: 'danger' }, { t: '🤝 Negarse juntos a seguir', sub: `Astucia + audiencia (${G.fame})` }, { t: '🕊️ Dejarlo ganar a él' }] });
  if (i === 0) { Snd.play('betray'); G.over = false; const r = await fight([G.P], [G.C], { noflee: true, banner: 'UNO SOLO' }); G.over = true; if (!G.P.alive) return gameOver(true); mark(`Mataste a ${cap(G.C.name)} en el final.`); return victory(); }
  if (i === 1) { const c = chk('ast', 14 - Math.floor(G.fame / 15) - Math.floor(G.loyalty / 30)); if (c.ok) { G.both = true; return victory(`Se paran espalda con espalda y miran a las cámaras. El público enloquece. Después de un silencio eterno: "Se anuncia un cambio en las reglas. Ambos tributos... son los vencedores." ${c.s}`); } await tell({ title: 'Silencio', biome: 'corn', text: `Nadie responde. Y entonces ${cap(G.C.name)} se mueve primero... ${c.s}`, cls: 'bad', btn: 'Pelear' }); G.over = false; const r = await fight([G.P], [G.C], { ambush: true, noflee: true, banner: 'UNO SOLO' }); G.over = true; if (!G.P.alive) return gameOver(true); return victory(); }
  ach('martir'); G.P.alive = false; G.P.killer = 'su propia decisión'; G.P.diedDay = G.day; mark(`Te sacrificaste para que ${cap(G.C.name)} gane.`);
  return gameOver(true, `Le das la mano a ${cap(G.C.name)}, das un paso atrás y te dejás caer. ${cap(G.C.name)} gana los Juegos. El público llora. Vos te volvés leyenda.`);
}
// ---------- Final ----------
function placeOf() { return aliveT().length + 1; }
async function victory(txt) {
  G.over = true; busy = false; REC.plays++; REC.wins++; REC.best = 1; REC.kills = Math.max(REC.kills, G.P.kills); saveRec();
  ach('vencedor'); if (!G.P.kills) ach('pacifista'); if (G.both) ach('juntos'); if (!G.C.alive) ach('solo'); if (Opt.diff > 1.1) ach('dificil');
  Snd.music('none'); Snd.play('win'); flash('#ffd27a', .6);
  endScreen(true, txt || `${cap(G.P.name)} es el vencedor de los Juegos de La Población.`, G.both ? `${cap(G.P.name)} & ${cap(G.C.name)}` : cap(G.P.name));
}
async function gameOver(skipSim, txt) {
  if (G.ended) return; G.ended = true; G.over = true; busy = false;
  const place = placeOf(); REC.plays++; REC.best = Math.min(REC.best, place); REC.kills = Math.max(REC.kills, G.P.kills); saveRec();
  Snd.music('none'); Snd.play('lose'); Snd.play('cannon');
  // simular el resto
  let guard = 0, al = aliveTeams().filter(tm => !tm.player || tm.m.some(t => t.alive && t !== G.P));
  if (G.C.alive) myTeam().player = false;
  while (aliveTeams().length > 1 && guard++ < 60) { const ts = aliveTeams(); if (ts.length > 1) { const [a, b] = shuffle(ts); aiFight(a, b); } }
  const winT = aliveTeams()[0], winner = winT ? winT.m.filter(t => t.alive).map(t => cap(t.name)).join(' y ') : 'nadie';
  endScreen(false, txt || `${cap(G.P.name)} cayó en el puesto #${place}. ${G.P.killer ? 'Lo mató ' + (typeof G.P.killer === 'string' ? G.P.killer : '') + '.' : ''}`, winner, place);
}
function endScreen(won, txt, winner, place) {
  clearSave();
  BG.set(true);
  view(`<div class="screen"><div class="wrap" style="max-width:820px"><div style="text-align:center"><span class="tag">${won ? 'Vencedor' : 'Fin del juego'}</span><div class="endbig disp" style="margin-top:10px;${won ? 'color:var(--gold)' : 'color:#ff6b5b'}">${won ? '¡GANASTE!' : 'CAÍSTE'}</div>
  <div style="display:flex;justify-content:center;gap:10px;margin:18px 0"><img src="${portrait(G.P.ch, 200, won ? 0 : 2)}" style="width:110px;height:110px;border-radius:50%;border:3px solid ${won ? 'var(--gold)' : '#555'}">${G.both ? `<img src="${portrait(G.C.ch, 200)}" style="width:110px;height:110px;border-radius:50%;border:3px solid var(--gold)">` : ''}</div>
  <p style="font-size:1.05rem;line-height:1.6;max-width:600px;margin:0 auto">${txt}</p>${!won ? `<p class="mut" style="margin-top:8px">Ganador de los Juegos: <b style="color:var(--gold)">${winner}</b></p>` : ''}</div>
  <div class="stats"><div><b>#${won ? 1 : place}</b><span>Puesto</span></div><div><b>${G.P.kills}</b><span>Bajas</span></div><div><b>${G.day}</b><span>Días</span></div><div><b>${G.fame}</b><span>Audiencia</span></div><div><b>${G.stats ? G.stats.dealt : 0}</b><span>Daño hecho</span></div><div><b>${G.stats ? G.stats.taken : 0}</b><span>Daño recibido</span></div></div>
  <div class="card"><div class="sectitle">Tu historia</div><div class="timeline">${G.timeline.length ? G.timeline.map(t => `<p>${t}</p>`).join('') : '<p class="mut">Pasaste desapercibido.</p>'}</div></div>
  <div class="card" style="margin-top:12px"><div class="sectitle">Los 16</div><div class="grid16" style="padding:12px">${G.all.slice().sort((a, b) => (b.alive - a.alive) || (b.diedDay - a.diedDay)).map(t => `<div class="tcard ${t.alive ? 'sel' : ''}" style="cursor:default"><img src="${portrait(t.ch, 120, t.alive ? 0 : 2)}" class="${t.alive ? '' : 'dead'}"><div class="nm">${cap(t.name)}</div><div class="pk">${t.alive ? 'Sobrevivió' : 'Día ' + t.diedDay + ' · ' + esc(t.killer || '')}${t.kills ? ' · ' + t.kills + '☠' : ''}</div></div>`).join('')}</div></div>
  <div style="display:flex;gap:10px;justify-content:center;margin:20px 0 40px;flex-wrap:wrap"><button class="btn primary" id="again">Jugar otra vez</button><button class="btn" id="home">Menú</button></div></div></div>`);
  $('#again').onclick = screenSelect; $('#home').onclick = screenTitle;
}
window.__dbg = () => G;
screenTitle();
// atajos de teclado
addEventListener('keydown', e => {
  if (e.repeat) return;
  const cb = [...document.querySelectorAll('.combat .acts-c .btn:not([disabled])')];
  if (cb.length && /^[1-9]$/.test(e.key)) { const b = cb[+e.key - 1]; if (b) b.click(); return; }
  const mb = [...document.querySelectorAll('.modal [data-i]:not([disabled])')];
  if (mb.length) { if (/^[1-9]$/.test(e.key) && mb[+e.key - 1]) mb[+e.key - 1].click(); else if ((e.key === 'Enter' || e.key === ' ') && mb.length === 1) { e.preventDefault(); mb[0].click(); } return; }
  const k = { e: 'explore', c: 'hunt', d: 'rest', s: 'hide' }[e.key.toLowerCase()];
  const b = k && document.querySelector(`#side [data-a="${k}"]:not([disabled])`); if (b) b.click();
});
